name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SCHEME: SwashbucklerDiary
  PROJECT: SwashbucklerDiary.xcodeproj

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 工程用了 iOS 26 的 Liquid Glass API（glassEffect / GlassEffectContainer /
          # tabBarMinimizeBehavior），只有 Xcode 26 的 SDK 才有。
          xcode-version: '26.6'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (Swift compile check)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Archive (device, unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SwashbucklerDiary.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP="build/SwashbucklerDiary.xcarchive/Products/Applications/SwashbucklerDiary.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到 .app：$APP"
            find build -maxdepth 4 -name "*.app" -type d || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload SwashbucklerDiary-unsigned.ipa
          ls -lh SwashbucklerDiary-unsigned.ipa

      # 装不上的时候，靠这一步直接看出包到底缺什么：架构、最低系统版本、
      # Info.plist 关键字段、签名状态。别再靠肉眼猜。
      - name: Validate IPA
        run: |
          cd build
          APP="Payload/SwashbucklerDiary.app"
          echo "=== zip 结构 ==="
          unzip -l SwashbucklerDiary-unsigned.ipa | sed -n '1,40p'
          echo "=== 架构 ==="
          lipo -archs "$APP/SwashbucklerDiary" || file "$APP/SwashbucklerDiary"
          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist"
          echo "=== 签名 ==="
          codesign -dv "$APP" 2>&1 | head -20 || echo "(未签名，符合预期)"
          echo "=== 体积 ==="
          du -sh "$APP"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwashbucklerDiary-unsigned-ipa
          path: build/SwashbucklerDiary-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
