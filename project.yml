name: SwashbucklerDiary

options:
  bundleIdPrefix: com.zrtnb
  deploymentTarget:
    # 部署目标刻意压到 18.0：Liquid Glass 相关 API 全部用 if #available(iOS 26.0, *)
    # 包了一层，所以 iOS 18/26 都能装，玻璃只在 26+ 上出现。
    # 写死 26.0 会导致低于 26 的设备「压根装不上」，坑过一次。
    iOS: "18.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zrtnb.swashbucklerdiary
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  SwashbucklerDiary:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    info:
      # 注意：XcodeGen 会在 generate 时用下面的 properties 覆写这个文件，
      # 手写在 App/Resources/Info.plist 里的键不会生效（踩过）。
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: "侠客日记"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 资源编辑要用到的权限。PHPicker 免权限，但相机 / 麦克风 / 定位必须声明，
        # 否则一调用就闪退。
        NSPhotoLibraryUsageDescription: "用于把照片插入到日记里"
        NSPhotoLibraryAddUsageDescription: "用于保存日记里的图片"
        NSCameraUsageDescription: "用于拍照并插入到日记里"
        NSMicrophoneUsageDescription: "用于录音并插入到日记里"
        NSLocationWhenInUseUsageDescription: "用于在日记里记录位置"
    settings:
      base:
        PRODUCT_NAME: SwashbucklerDiary
        INFOPLIST_KEY_CFBundleDisplayName: "侠客日记"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    scheme:
      gatherCoverageData: false
      testTargets: []
